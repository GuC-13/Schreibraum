<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Schreibraum">
<title>Schreibraum</title>
<style>
  :root {
    --bg: #f1f5f9; --card: #ffffff; --border: #e2e8f0; --text: #0f172a; --muted: #64748b;
    --accent: #2563eb; --accent-dark: #1d4ed8; --danger: #dc2626; --success: #16a34a; --warn: #b45309;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; overscroll-behavior: none; }
  #app { max-width: 900px; margin: 0 auto; padding: 16px 16px 60px; }
  #app.schreibraum-fullboard { max-width: none; padding: 10px 10px 16px; }
  #app.schreibraum-wide { max-width: none; }
  .view.hidden, .hidden { display: none !important; }
  h1 { font-size: 1.4rem; margin: 4px 0 4px; text-align: center; }
  h2.sub { font-size: 1rem; text-align: center; margin: 0 0 18px; color: var(--muted); font-weight: 500; }
  .row { display: flex; gap: 10px; }
  .row.back-row { margin-bottom: 14px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
  .btn { border: none; border-radius: 10px; padding: 12px 18px; font-size: 1rem; font-weight: 700; cursor: pointer; color: white; background: var(--accent); }
  .btn-big { width: 100%; padding: 20px; font-size: 1.15rem; border-radius: 16px; margin-bottom: 12px; }
  .btn-small { padding: 8px 12px; font-size: 0.9rem; }
  .btn-secondary { background: #64748b; }
  .btn-secondary.btn-active { background: var(--accent); }
  .btn-outline { background: #fff; color: var(--text); border: 2px solid var(--border); }
  .btn-danger { background: var(--danger); }
  .btn:disabled { opacity: 0.5; cursor: default; }
  .setup-card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 16px; margin-bottom: 14px; }
  label.field-label { font-size: 0.82rem; font-weight: 700; color: var(--muted); display: block; margin-bottom: 6px; margin-top: 12px; }
  label.field-label:first-child { margin-top: 0; }
  .field-hint { font-size: 0.8rem; color: var(--muted); margin: 4px 0 0; }
  input[type="text"], textarea {
    border: 1px solid var(--border); border-radius: 8px; padding: 10px; font-size: 1rem; width: 100%; background: white; color: var(--text); font-family: inherit;
  }
  textarea[readonly] { background: #f8fafc; color: var(--muted); }
  .modal-overlay { position: fixed; inset: 0; background: rgba(15,23,42,0.55); display: flex; align-items: center; justify-content: center; z-index: 400; padding: 16px; }
  .modal-box { background: var(--card); border-radius: 14px; padding: 20px; max-width: 420px; width: 100%; max-height: 90vh; overflow-y: auto; }
  .modal-actions { display: flex; gap: 10px; margin-top: 16px; justify-content: flex-end; }
  .schreibraum-color-swatch { width: 36px; height: 36px; border-radius: 50%; border: 3px solid transparent; cursor: pointer; padding: 0; }
  .schreibraum-color-swatch.schreibraum-active { border-color: var(--text); box-shadow: 0 0 0 2px #fff inset; }
  .schreibraum-size-btn { width: 32px; height: 32px; border-radius: 50%; border: 1px solid var(--border); background: #fff; cursor: pointer; display: flex; align-items: center; justify-content: center; padding: 0; }
  .schreibraum-size-btn span { display: block; border-radius: 50%; background: #0f172a; }
  .schreibraum-size-btn.schreibraum-active { border-color: var(--accent); background: #eff6ff; }
  #schreibraumEraserBtn.btn-active { background: var(--accent); }
  .schreibraum-card-away { opacity: 0.6; }
  .schreibraum-away-badge { display: inline-block; font-size: 0.72rem; font-weight: 700; color: #fff; background: #64748b; border-radius: 6px; padding: 1px 6px; margin-left: 6px; vertical-align: middle; }
  .schreibraum-done-badge { background: var(--success); }
  .schreibraum-react-btn { border: none; background: #f1f5f9; border-radius: 50%; width: 30px; height: 30px; font-size: 1rem; cursor: pointer; flex-shrink: 0; padding: 0; }
  .schreibraum-react-btn:active { transform: scale(0.9); }
  .schreibraum-board-frame {
    position: relative;
    margin: 34px 0 0;
    padding: 22px 18px 18px;
    border-radius: 22px 22px 30px 30px / 22px 22px 40px 40px;
    border-width: 18px;
    border-style: solid;
    border-color: var(--board-color, var(--accent));
    background: #ffffff;
    box-shadow: 0 12px 30px rgba(15, 23, 42, 0.22), inset 0 0 0 4px rgba(255, 255, 255, 0.55);
  }
  .schreibraum-board-frame::before {
    content: "";
    position: absolute;
    top: -26px;
    left: 50%;
    transform: translateX(-50%);
    width: 70px;
    height: 26px;
    background: var(--board-color, var(--accent));
    border-radius: 10px 10px 3px 3px;
  }
  /* Lehrperson: Werkzeugleiste und Karten */
  .schreibraum-toolbar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 10px; }
  .schreibraum-stats { color: var(--muted); font-size: 0.95rem; margin: 6px 0 0; }
  .schreibraum-stats b { color: var(--text); }
  .schreibraum-card { position: relative; padding: 12px; margin: 0; border-left: 8px solid #94a3b8; display: flex; flex-direction: column; min-width: 0; }
  .schreibraum-card-head { display: flex; align-items: center; justify-content: space-between; gap: 6px; margin-bottom: 6px; }
  .schreibraum-card-name { font-weight: 800; font-size: 1.05rem; min-width: 0; overflow-wrap: anywhere; }
  .schreibraum-card-actions { display: flex; gap: 4px; flex-wrap: wrap; justify-content: flex-end; }
  .schreibraum-card-body { max-height: 260px; overflow: auto; }
  .schreibraum-card-text { white-space: pre-wrap; overflow-wrap: anywhere; min-height: 40px; }
  .schreibraum-card-body img { width: 100%; border-radius: 8px; border: 1px solid var(--border); background: #fff; display: block; margin-top: 6px; }
  .schreibraum-card-empty { color: var(--muted); font-style: italic; min-height: 40px; }
  .schreibraum-last-reaction { font-size: 0.85rem; opacity: 0.55; margin-left: 4px; }
  /* Schüler: Status und Sperre */
  .schreibraum-status { font-size: 0.85rem; font-weight: 700; color: var(--success); }
  .schreibraum-status.schreibraum-status-busy { color: var(--muted); }
  .schreibraum-status.schreibraum-status-warn { color: var(--warn); }
  .schreibraum-lock-banner { background: #fef3c7; color: #78350f; border-radius: 12px; padding: 12px 14px; font-weight: 700; text-align: center; margin-bottom: 10px; }
  #schreibraumDrawCanvas { display: block; width: min(100%, calc(68vh * 4 / 3)); aspect-ratio: 4 / 3; margin: 0 auto; touch-action: none; border-radius: 16px; border: 1px solid var(--border); background: #ffffff; box-shadow: 0 4px 16px rgba(15,23,42,0.12); }
  #schreibraumDrawWrap.schreibraum-locked #schreibraumDrawCanvas { opacity: 0.6; pointer-events: none; }
  #schreibraumWriteQuestion.schreibraum-flash { animation: schreibraumFlash 1.2s ease-out; }
  @keyframes schreibraumFlash { 0% { background: #fde68a; } 100% { background: transparent; } }
  #schreibraumReactionPopup.hidden { display: none !important; }
  @keyframes schreibraumReactionPop {
    0% { transform: scale(0.3); opacity: 0; }
    60% { transform: scale(1.15); opacity: 1; }
    100% { transform: scale(1); opacity: 1; }
  }
  @media (prefers-reduced-motion: reduce) { #schreibraumReactionPopup, #schreibraumWriteQuestion.schreibraum-flash { animation: none; } }
  #appVersionLabel { text-align: center; margin-top: 14px; font-size: 0.68rem; color: var(--muted); opacity: 0.6; }
</style>
</head>
<body>
<div id="app">

  <!-- START: Raum eröffnen -->
  <div id="schreibraumPickView" class="view">
    <h1>🖊️ Schreibraum</h1>
    <button class="btn btn-big btn-outline hidden" id="schreibraumResumeStudentBtn"></button>
    <button class="btn btn-big btn-outline hidden" id="schreibraumResumeHostBtn"></button>
    <button class="btn btn-big" id="schreibraumHostBtn">👩‍🏫 Raum eröffnen</button>
    <button class="btn btn-big btn-secondary" id="schreibraumGoJoinBtn">🙋 Raum beitreten</button>
    <p id="schreibraumSetupNote" class="hidden" style="color:var(--muted); font-size:0.9rem; margin-top:16px;"></p>
    <button id="appShareQrBtn" aria-label="QR-Code zum Teilen der App vergrössern" style="position:fixed; right:16px; bottom:16px; z-index:150; width:60px; height:60px; padding:4px; border-radius:14px; border:none; background:#fff; box-shadow:0 6px 18px rgba(15,23,42,0.25); cursor:pointer;">
      <canvas id="appShareQrCanvas" style="width:100%; height:100%; image-rendering:pixelated; display:block;"></canvas>
    </button>
  </div>

  <!-- Lehrperson: Übersicht und Live-Boards in einer Ansicht -->
  <div id="schreibraumHostView" class="view hidden">
    <div class="row back-row">
      <button class="btn btn-secondary" id="schreibraumHostCloseBtn">← Raum schliessen</button>
      <button class="btn btn-secondary btn-small" id="schreibraumExportBtn">⬇️ Antworten sichern</button>
    </div>
    <div class="setup-card" style="display:flex; gap:16px; align-items:center; flex-wrap:wrap;">
      <button id="schreibraumQrOpenBtn" style="background:none; border:none; padding:0; cursor:pointer;" aria-label="QR-Code vergrössern">
        <canvas id="schreibraumQrCanvas" style="width:110px; height:110px; image-rendering:pixelated;"></canvas>
      </button>
      <div style="flex:1; min-width:180px;">
        <label class="field-label">PIN · QR antippen zum Vergrössern</label>
        <div id="schreibraumPinDisplay" style="font-size:2.4rem; font-weight:800; letter-spacing:0.15em;">----</div>
        <p class="schreibraum-stats" id="schreibraumHostStats">0 beigetreten</p>
      </div>
    </div>
    <div class="setup-card">
      <label class="field-label" for="schreibraumQuestionInput">Frage / Auftrag (optional, erscheint sofort bei allen SuS)</label>
      <input type="text" id="schreibraumQuestionInput" placeholder="z.B. Was ist ein Prisma?">
    </div>
    <div class="schreibraum-toolbar">
      <button class="btn btn-secondary btn-small" id="schreibraumLockBtn" title="Eingabe bei allen SuS sperren">✋ Stifte weg</button>
      <button class="btn btn-secondary btn-small" id="schreibraumNewRoundBtn" title="Alle Boards leeren für die nächste Frage">🧹 Neue Runde</button>
      <span style="display:flex; align-items:center; gap:6px; margin-left:auto;">
        <label for="schreibraumMonitorZoomSlider" style="font-size:0.82rem; font-weight:700; color:var(--muted);">Karten pro Zeile</label>
        <input type="range" id="schreibraumMonitorZoomSlider" min="1" max="8" step="1" value="4" style="width:110px;">
        <span id="schreibraumMonitorZoomLabel" style="font-size:0.85rem; color:var(--muted); min-width:14px;">4</span>
      </span>
    </div>
    <div id="schreibraumMonitorPager" class="hidden" style="display:flex; align-items:center; justify-content:center; gap:14px; margin:0 0 12px;">
      <button class="btn btn-secondary" id="schreibraumMonitorPrevBtn" style="padding:8px 16px;">‹ Zurück</button>
      <span id="schreibraumMonitorPageLabel" style="font-weight:700; color:var(--muted);">Seite 1/1</span>
      <button class="btn btn-secondary" id="schreibraumMonitorNextBtn" style="padding:8px 16px;">Weiter ›</button>
    </div>
    <div id="schreibraumMonitorGrid" style="display:grid; gap:10px;"></div>
  </div>

  <!-- Beitreten (Schüler: über QR-Link mit vorausgefüllter PIN, oder manuell über den Button auf der Startseite) -->
  <div id="schreibraumJoinView" class="view hidden">
    <div class="row back-row"><button class="btn btn-secondary" data-back-pick>← Zurück</button></div>
    <h1>🙋 Schreibraum beitreten</h1>
    <button class="btn btn-big btn-outline hidden" id="schreibraumJoinResumeBtn"></button>
    <div class="setup-card">
      <label class="field-label" for="schreibraumJoinPinInput">PIN</label>
      <input type="text" id="schreibraumJoinPinInput" placeholder="z.B. 4821" maxlength="4" inputmode="numeric" autocomplete="off" style="font-size:1.3rem; text-align:center; letter-spacing:0.1em;">
      <label class="field-label" for="schreibraumJoinNameInput">Dein Name</label>
      <input type="text" id="schreibraumJoinNameInput" placeholder="Vorname" maxlength="24" autocomplete="off">
      <p class="field-hint">Vorname genügt. Bei gleichen Vornamen: Initial des Nachnamens ergänzen (z.B. «Lea M.»).</p>
      <label class="field-label">Deine Boardfarbe</label>
      <div id="schreibraumJoinColorRow" style="display:flex; gap:8px; flex-wrap:wrap;"></div>
    </div>
    <p id="schreibraumJoinError" class="hidden" style="color:var(--danger); font-size:0.9rem;"></p>
    <button class="btn btn-big" id="schreibraumJoinBtn">Beitreten</button>
  </div>

  <!-- Schreiben (Schüler) -->
  <div id="schreibraumWriteView" class="view hidden">
    <div class="row back-row">
      <button class="btn btn-secondary" id="schreibraumWriteLeaveBtn">← Verlassen</button>
      <span class="schreibraum-status" id="schreibraumWriteStatus" role="status" aria-live="polite">✓ Gespeichert</span>
    </div>
    <div id="schreibraumWriteCard" class="schreibraum-board-frame">
      <h1 style="text-align:center; font-size:2rem;" id="schreibraumWriteName"></h1>
      <p id="schreibraumWriteQuestion" class="sub hidden" style="font-size:1.2rem; font-weight:700; color:var(--text); text-align:center; border-radius:8px; padding:4px 8px;"></p>
      <div id="schreibraumLockBanner" class="schreibraum-lock-banner hidden">✋ Stifte weg – schau nach vorne.</div>
      <div class="choice-row" style="display:flex; gap:8px; margin-bottom:10px;">
        <button class="btn btn-secondary" id="schreibraumModeTextBtn" style="flex:1;">⌨️ Tippen</button>
        <button class="btn btn-secondary" id="schreibraumModeDrawBtn" style="flex:1;">✏️ Zeichnen</button>
      </div>
      <textarea id="schreibraumWriteTextarea" placeholder="Hier schreiben …" style="width:100%; box-sizing:border-box; min-height:60vh; font-size:1.2rem; padding:14px; border-radius:12px; border:1px solid var(--border); resize:vertical;"></textarea>
      <div id="schreibraumDrawWrap" class="hidden">
        <div id="schreibraumDrawTools" style="display:flex; gap:14px; align-items:center; flex-wrap:wrap; margin-bottom:10px;">
          <div style="display:flex; gap:6px; flex-wrap:wrap;">
            <button class="schreibraum-color-swatch schreibraum-active" data-color="#0f172a" style="background:#0f172a;" aria-label="Schwarz"></button>
            <button class="schreibraum-color-swatch" data-color="#2563eb" style="background:#2563eb;" aria-label="Blau"></button>
            <button class="schreibraum-color-swatch" data-color="#dc2626" style="background:#dc2626;" aria-label="Rot"></button>
            <button class="schreibraum-color-swatch" data-color="#16a34a" style="background:#16a34a;" aria-label="Grün"></button>
            <button class="schreibraum-color-swatch" data-color="#ea580c" style="background:#ea580c;" aria-label="Orange"></button>
            <button class="schreibraum-color-swatch" data-color="#7c3aed" style="background:#7c3aed;" aria-label="Violett"></button>
            <button class="schreibraum-color-swatch" data-color="#db2777" style="background:#db2777;" aria-label="Pink"></button>
            <button class="schreibraum-color-swatch" data-color="#0891b2" style="background:#0891b2;" aria-label="Türkis"></button>
          </div>
          <div style="display:flex; gap:6px; align-items:center;">
            <button class="schreibraum-size-btn" data-size="4" aria-label="Dünn"><span style="width:6px; height:6px;"></span></button>
            <button class="schreibraum-size-btn schreibraum-active" data-size="8" aria-label="Mittel"><span style="width:11px; height:11px;"></span></button>
            <button class="schreibraum-size-btn" data-size="16" aria-label="Dick"><span style="width:18px; height:18px;"></span></button>
          </div>
          <button class="btn btn-secondary" id="schreibraumEraserBtn">🧽 Radierer</button>
          <button class="btn btn-secondary" id="schreibraumUndoBtn" disabled>↶ Rückgängig</button>
          <button class="btn btn-secondary" id="schreibraumDrawClearBtn">🗑️ Alles löschen</button>
        </div>
        <canvas id="schreibraumDrawCanvas"></canvas>
      </div>
      <button class="btn btn-big btn-outline" id="schreibraumDoneBtn" style="margin:14px 0 0;">✋ Ich bin fertig</button>
    </div>
  </div>

  <p id="appVersionLabel">v2026-10-26.2</p>
</div>

<!-- QR Vollbild (Raum-PIN) -->
<div id="schreibraumQrFullscreen" class="hidden" style="position:fixed; inset:0; background:#ffffff; z-index:300; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:20px;">
  <canvas id="schreibraumQrCanvasBig" style="width:min(80vw, 70vh); height:min(80vw, 70vh); image-rendering:pixelated;"></canvas>
  <div style="font-size:2rem; font-weight:800; letter-spacing:0.15em;" id="schreibraumQrBigPin">----</div>
  <div style="color:var(--muted);" id="schreibraumQrBigCount"></div>
  <button class="btn btn-secondary" id="schreibraumQrCloseBtn">Schliessen</button>
</div>

<!-- QR Vollbild (App-Link teilen) -->
<div id="appShareQrFullscreen" style="display:none; position:fixed; inset:0; background:#ffffff; z-index:300; flex-direction:column; align-items:center; justify-content:center; gap:20px; text-align:center; padding:24px;">
  <canvas id="appShareQrCanvasBig" style="width:min(80vw, 500px); height:min(80vw, 500px); image-rendering:pixelated;"></canvas>
  <div style="font-size:1.1rem; font-weight:700; word-break:break-all; max-width:320px;">guc-13.github.io/Schreibraum/</div>
  <button class="btn btn-secondary" id="appShareQrCloseBtn">Schliessen</button>
</div>

<!-- Rückmeldung der Lehrperson - poppt beim Schüler-Gerät unten rechts auf (nur dort sichtbar) -->
<div id="schreibraumReactionPopup" class="hidden" style="position:fixed; right:16px; bottom:16px; z-index:250; background:var(--success); color:white; border-radius:20px; padding:12px 18px; display:flex; align-items:center; gap:10px; font-weight:800; font-size:1.1rem; box-shadow:0 6px 18px rgba(0,0,0,0.28); animation:schreibraumReactionPop 0.4s ease-out;">
  <span id="schreibraumReactionEmoji" style="font-size:2.2rem;">👍</span><span id="schreibraumReactionText"></span>
</div>

<!-- Generic Confirm Modal -->
<div class="modal-overlay hidden" id="confirmOverlay">
  <div class="modal-box">
    <p id="confirmMessage" style="font-size:1.05rem; margin:0 0 16px;"></p>
    <div class="modal-actions">
      <button class="btn btn-secondary" id="confirmCancel">Abbrechen</button>
      <button class="btn btn-danger" id="confirmOk">Bestätigen</button>
    </div>
  </div>
</div>

<script>
/* =========================================================================
   HILFSFUNKTIONEN
   ========================================================================= */
function escapeHtml(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }

let confirmCb = null;
function openConfirm(message, onConfirm, confirmLabel) {
  document.getElementById("confirmMessage").textContent = message;
  document.getElementById("confirmOk").textContent = confirmLabel || "Bestätigen";
  document.getElementById("confirmOk").className = onConfirm ? "btn btn-danger" : "btn";
  document.getElementById("confirmCancel").classList.toggle("hidden", !onConfirm);
  confirmCb = onConfirm;
  document.getElementById("confirmOverlay").classList.remove("hidden");
}
document.getElementById("confirmOk").addEventListener("click", () => { const cb = confirmCb; document.getElementById("confirmOverlay").classList.add("hidden"); confirmCb = null; if (cb) cb(); });
document.getElementById("confirmCancel").addEventListener("click", () => { document.getElementById("confirmOverlay").classList.add("hidden"); confirmCb = null; });

function showView(name) {
  document.querySelectorAll(".view").forEach(v => v.classList.add("hidden"));
  document.getElementById(name + "View").classList.remove("hidden");
  document.getElementById("app").classList.toggle("schreibraum-fullboard", name === "schreibraumWrite");
  document.getElementById("app").classList.toggle("schreibraum-wide", name === "schreibraumHost");
  if (name === "schreibraumPick") schreibraumRenderResume();
}

// localStorage kann (privater Modus, gesperrte Website-Daten) fehlen oder werfen
function storageGet(key) { try { return JSON.parse(localStorage.getItem(key)); } catch (e) { return null; } }
function storageSet(key, value) { try { if (value == null) localStorage.removeItem(key); else localStorage.setItem(key, JSON.stringify(value)); } catch (e) {} }

/* =========================================================================
   QR-CODE-GENERATOR (offline, ohne externe Bibliothek)
   Unterstützt Byte-Modus, Version 1-5, Fehlerkorrektur-Level L (ausreichend
   für kurze Links/Texte bis ca. 106 Zeichen), fixe Maske 0 (spart die
   Penalty-Bewertung, ohne die Gültigkeit des Codes zu beeinträchtigen).
   ========================================================================= */
const QR_GF_EXP = new Array(256);
const QR_GF_LOG = new Array(256);
(function qrInitGaloisField() {
  let x = 1;
  for (let i = 0; i < 255; i++) {
    QR_GF_EXP[i] = x;
    QR_GF_LOG[x] = i;
    x <<= 1;
    if (x & 0x100) x ^= 0x11D;
  }
})();
function qrGfMul(a, b) {
  if (a === 0 || b === 0) return 0;
  return QR_GF_EXP[(QR_GF_LOG[a] + QR_GF_LOG[b]) % 255];
}
function qrPolyMultiply(a, b) {
  const result = new Array(a.length + b.length - 1).fill(0);
  for (let i = 0; i < a.length; i++) for (let j = 0; j < b.length; j++) result[i + j] ^= qrGfMul(a[i], b[j]);
  return result;
}
function qrGeneratorPoly(degree) {
  let g = [1];
  for (let i = 0; i < degree; i++) g = qrPolyMultiply(g, [1, QR_GF_EXP[i]]);
  return g;
}

function isFirebaseConfigured() { return !!FIREBASE_CONFIG.apiKey && !FIREBASE_CONFIG.apiKey.startsWith("PASTE_HIER"); }
let firebaseDb = null, firebaseReady = false;
function loadScriptOnce(src) {
  return new Promise((resolve, reject) => {
    if (document.querySelector(`script[src="${src}"]`)) { resolve(); return; }
    const s = document.createElement("script");
    s.src = src; s.onload = () => resolve(); s.onerror = () => reject(new Error("load failed: " + src));
    document.head.appendChild(s);
  });
}
async function ensureFirebase() {
  if (firebaseReady) return true;
  if (!isFirebaseConfigured()) return false;
  try {
    await loadScriptOnce("https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js");
    await loadScriptOnce("https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js");
    if (!firebase.apps || !firebase.apps.length) firebase.initializeApp(FIREBASE_CONFIG);
    firebaseDb = firebase.firestore();
    firebaseDb.settings({ experimentalAutoDetectLongPolling: true });
    firebaseReady = true;
    return true;
  } catch (e) {
    console.error("Schreibraum: Firebase konnte nicht geladen werden.", e);
    return false;
  }
}

/* =========================================================================
   SCHREIBRAUM
   ========================================================================= */
const SCHREIBRAUM_PALETTE = [
  "#2563eb", "#dc2626", "#16a34a", "#f59e0b", "#7c3aed", "#db2777", "#0891b2", "#64748b",
  "#ea580c", "#eab308", "#4f46e5", "#059669", "#0d9488", "#be123c", "#a855f7", "#65a30d",
  "#78716c", "#1e293b", "#f472b6", "#0ea5e9"
];
// Rückmeldungen sieht nur die betroffene Person auf dem eigenen Gerät, nie die Klasse
const SCHREIBRAUM_REACTIONS = [
  { emoji: "👍", text: "Super!" },
  { emoji: "⭐", text: "Stark gemacht!" },
  { emoji: "🤔", text: "Überleg nochmals" }
];
const SCHREIBRAUM_ROOM_MAX_AGE_MS = 12 * 60 * 60 * 1000; // ältere Räume gelten als abgelaufen und werden gelöscht
// Heartbeat sparsam: 30 SuS × alle 4 s hätte das Firebase-Gratiskontingent nach einer Lektion aufgebraucht
const SCHREIBRAUM_HEARTBEAT_MS = 20000;
const SCHREIBRAUM_AWAY_MS = 50000;
const SCHREIBRAUM_HOST_KEY = "schreibraum-host";
const SCHREIBRAUM_STUDENT_KEY = "schreibraum-student";
let schreibraumSelectedColor = SCHREIBRAUM_PALETTE[0];
let schreibraumPin = null, schreibraumIsHost = false;
let schreibraumStudentId = null, schreibraumStudentName = null;
let schreibraumStudentsUnsub = null, schreibraumRoomUnsub = null, schreibraumSelfUnsub = null;
let schreibraumHeartbeatIv = null;
let schreibraumLastStudents = [];
let schreibraumHostWatchIv = null;
let schreibraumLastReactionTs = 0, schreibraumLastClearedAt = 0;
let schreibraumServerOffset = 0; // Serverzeit minus Gerätezeit der Lehrperson (falsch gestellte Uhr ≠ alle «weg»)
function schreibraumGeneratePin() { return String(Math.floor(Math.random() * 9000) + 1000); }
function schreibraumRoomRef(pin) { return firebaseDb.collection("writerooms").doc(pin); }
function schreibraumSafeColor(c) { return /^#[0-9a-f]{6}$/i.test(c || "") ? c : "#94a3b8"; }
function schreibraumSafeImage(d) { return typeof d === "string" && /^data:image\/(png|jpeg|webp);base64,[A-Za-z0-9+/=]+$/.test(d) ? d : null; }
function schreibraumHasContent(s) { return !!((s.text || "").trim() || schreibraumSafeImage(s.drawingData)); }
function schreibraumIsAway(s) {
  if (s.left || s.active === false) return true;
  const lastSeenMs = s.lastSeen && typeof s.lastSeen.toMillis === "function" ? s.lastSeen.toMillis() : 0;
  return lastSeenMs > 0 && Date.now() + schreibraumServerOffset - lastSeenMs > SCHREIBRAUM_AWAY_MS;
}
function schreibraumWriteActive() {
  if (!schreibraumPin || !schreibraumStudentId) return;
  schreibraumRoomRef(schreibraumPin).collection("students").doc(schreibraumStudentId)
    .update({ active: !document.hidden, lastSeen: firebase.firestore.FieldValue.serverTimestamp() })
    .catch(err => console.error("Schreibraum: Status konnte nicht aktualisiert werden.", err));
}
function schreibraumStartHeartbeat() {
  schreibraumStopHeartbeat();
  document.addEventListener("visibilitychange", schreibraumWriteActive);
  schreibraumHeartbeatIv = setInterval(schreibraumWriteActive, SCHREIBRAUM_HEARTBEAT_MS);
}
function schreibraumStopHeartbeat() {
  if (schreibraumHeartbeatIv) { clearInterval(schreibraumHeartbeatIv); schreibraumHeartbeatIv = null; }
  document.removeEventListener("visibilitychange", schreibraumWriteActive);
}
function schreibraumStopListening() {
  if (schreibraumStudentsUnsub) { schreibraumStudentsUnsub(); schreibraumStudentsUnsub = null; }
  if (schreibraumRoomUnsub) { schreibraumRoomUnsub(); schreibraumRoomUnsub = null; }
  if (schreibraumSelfUnsub) { schreibraumSelfUnsub(); schreibraumSelfUnsub = null; }
  schreibraumStopHeartbeat();
  schreibraumStopHostWatch();
}
function schreibraumShowNote(text) {
  const note = document.getElementById("schreibraumSetupNote");
  note.textContent = text;
  note.classList.remove("hidden");
}
async function schreibraumCheckReady() {
  if (!isFirebaseConfigured()) { schreibraumShowNote("Der Schreibraum ist auf dieser Seite noch nicht eingerichtet (fehlende Firebase-Konfiguration)."); return false; }
  const ok = await ensureFirebase();
  if (!ok) schreibraumShowNote("Verbindung zum Schreibraum-Server konnte nicht hergestellt werden. Prüfe die Internetverbindung.");
  return ok;
}
async function schreibraumDeleteRoomData(pin) {
  const ref = schreibraumRoomRef(pin);
  const students = await ref.collection("students").get();
  const batch = firebaseDb.batch();
  students.forEach(d => batch.delete(d.ref));
  batch.delete(ref);
  await batch.commit();
}
// Datenschutz: Namen und Antworten nicht unbegrenzt liegen lassen
async function schreibraumCleanupStaleRooms() {
  try {
    const cutoff = Date.now() - SCHREIBRAUM_ROOM_MAX_AGE_MS;
    const snap = await firebaseDb.collection("writerooms").where("createdAt", "<", cutoff).limit(10).get();
    for (const d of snap.docs) await schreibraumDeleteRoomData(d.id);
  } catch (e) {
    console.warn("Schreibraum: Alte Räume konnten nicht aufgeräumt werden.", e);
  }
}

/* ---- Startseite: angefangene Sitzung fortsetzen ---- */
function schreibraumRenderResume() {
  const host = storageGet(SCHREIBRAUM_HOST_KEY);
  const student = storageGet(SCHREIBRAUM_STUDENT_KEY);
  const hostBtn = document.getElementById("schreibraumResumeHostBtn");
  const studentBtn = document.getElementById("schreibraumResumeStudentBtn");
  const hostValid = host && host.pin && Date.now() - (host.createdAt || 0) < SCHREIBRAUM_ROOM_MAX_AGE_MS;
  hostBtn.classList.toggle("hidden", !hostValid);
  if (hostValid) hostBtn.textContent = `↩️ Meinen Raum ${host.pin} wieder öffnen`;
  studentBtn.classList.toggle("hidden", !(student && student.pin));
  if (student && student.pin) studentBtn.textContent = `↩️ Weiterschreiben als ${student.name} (PIN ${student.pin})`;
  const joinResume = document.getElementById("schreibraumJoinResumeBtn");
  joinResume.classList.toggle("hidden", !(student && student.pin));
  if (student && student.pin) joinResume.textContent = `↩️ Weiterschreiben als ${student.name} (PIN ${student.pin})`;
}

/* =========================================================================
   LEHRPERSON
   ========================================================================= */
let schreibraumLocked = false;
const schreibraumCardCache = new Map();

document.getElementById("schreibraumHostBtn").addEventListener("click", async () => {
  const ok = await schreibraumCheckReady();
  if (!ok) return;
  schreibraumCleanupStaleRooms();
  try {
    let pin = null;
    for (let attempt = 0; attempt < 20 && !pin; attempt++) {
      const candidate = schreibraumGeneratePin();
      const doc = await schreibraumRoomRef(candidate).get();
      if (!doc.exists) pin = candidate;
      else if (Date.now() - (doc.data().createdAt || 0) > SCHREIBRAUM_ROOM_MAX_AGE_MS) {
        await schreibraumDeleteRoomData(candidate);
        pin = candidate;
      }
    }
    if (!pin) throw new Error("Keine freie PIN gefunden.");
    const createdAt = Date.now();
    await schreibraumRoomRef(pin).set({ createdAt, phase: "open", question: "" });
    storageSet(SCHREIBRAUM_HOST_KEY, { pin, createdAt });
    await schreibraumEnterHost(pin);
  } catch (e) {
    console.error("Schreibraum: Raum konnte nicht erstellt werden.", e);
    openConfirm("Raum konnte nicht erstellt werden. Prüfe die Internetverbindung.", null, "OK");
  }
});
document.getElementById("schreibraumResumeHostBtn").addEventListener("click", async () => {
  const host = storageGet(SCHREIBRAUM_HOST_KEY);
  if (!host || !(await schreibraumCheckReady())) return;
  try {
    const doc = await schreibraumRoomRef(host.pin).get();
    if (!doc.exists || doc.data().phase === "closed") {
      storageSet(SCHREIBRAUM_HOST_KEY, null);
      schreibraumRenderResume();
      openConfirm("Dieser Raum existiert nicht mehr. Eröffne einen neuen Raum.", null, "OK");
      return;
    }
    await schreibraumEnterHost(host.pin);
  } catch (e) {
    console.error("Schreibraum: Raum konnte nicht geöffnet werden.", e);
    openConfirm("Raum konnte nicht geöffnet werden. Prüfe die Internetverbindung.", null, "OK");
  }
});

async function schreibraumEnterHost(pin) {
  schreibraumIsHost = true;
  schreibraumPin = pin;
  const roomRef = schreibraumRoomRef(pin);
  // Uhrabgleich mit dem Server, damit «nicht in der App» auch bei falsch gestellter Laptop-Uhr stimmt
  const before = Date.now();
  await roomRef.update({ serverPing: firebase.firestore.FieldValue.serverTimestamp() });
  const roomDoc = await roomRef.get();
  const room = roomDoc.data() || {};
  if (room.serverPing && typeof room.serverPing.toMillis === "function") {
    schreibraumServerOffset = room.serverPing.toMillis() - (before + Date.now()) / 2;
  }
  schreibraumLocked = room.phase === "locked";
  schreibraumCardCache.clear();
  schreibraumLastStudents = [];
  document.getElementById("schreibraumPinDisplay").textContent = pin;
  document.getElementById("schreibraumQuestionInput").value = room.question || "";
  document.getElementById("schreibraumMonitorGrid").innerHTML = "";
  schreibraumMonitorPage = 0;
  schreibraumMonitorZoom = Math.max(1, Math.min(6, Math.floor(window.innerWidth / 240)));
  document.getElementById("schreibraumMonitorZoomSlider").value = String(schreibraumMonitorZoom);
  document.getElementById("schreibraumMonitorZoomLabel").textContent = String(schreibraumMonitorZoom);
  schreibraumRenderToggles();
  showView("schreibraumHost");
  qrDrawToCanvas(document.getElementById("schreibraumQrCanvas"), schreibraumJoinUrl(), 4);
  schreibraumStopListening();
  schreibraumStudentsUnsub = roomRef.collection("students").onSnapshot(snap => {
    const students = [];
    snap.forEach(d => students.push({ id: d.id, ...d.data() }));
    students.sort((a, b) => (a.joinedAt || 0) - (b.joinedAt || 0));
    schreibraumLastStudents = students;
    schreibraumRenderAll();
  }, err => console.error("Schreibraum: Antworten konnten nicht geladen werden.", err));
  schreibraumStartHostWatch();
}
function schreibraumJoinUrl() { return `${location.origin}${location.pathname}?join=${schreibraumPin}`; }

function schreibraumRenderToggles() {
  const lockBtn = document.getElementById("schreibraumLockBtn");
  lockBtn.classList.toggle("btn-active", schreibraumLocked);
  lockBtn.textContent = schreibraumLocked ? "✍️ Stifte freigeben" : "✋ Stifte weg";
}
// Frage geht ohne Senden-Knopf live raus (kurz entprellt, damit nicht jeder Buchstabe einzeln ankommt)
let schreibraumQuestionSaveTimeout = null;
document.getElementById("schreibraumQuestionInput").addEventListener("input", (e) => {
  if (!schreibraumPin) return;
  clearTimeout(schreibraumQuestionSaveTimeout);
  const question = e.target.value.trim();
  schreibraumQuestionSaveTimeout = setTimeout(() => {
    schreibraumRoomRef(schreibraumPin).update({ question }).catch(err => console.error("Schreibraum: Frage konnte nicht gespeichert werden.", err));
  }, 500);
});
document.getElementById("schreibraumLockBtn").addEventListener("click", () => {
  const locked = !schreibraumLocked;
  schreibraumRoomRef(schreibraumPin).update({ phase: locked ? "locked" : "open" })
    .then(() => { schreibraumLocked = locked; schreibraumRenderToggles(); })
    .catch(err => console.error("Schreibraum: Sperre konnte nicht gesetzt werden.", err));
});
document.getElementById("schreibraumNewRoundBtn").addEventListener("click", () => {
  if (!schreibraumLastStudents.length) return;
  openConfirm(`Alle ${schreibraumLastStudents.length} Boards leeren für die nächste Frage? Die SuS bleiben im Raum. Tipp: vorher mit «⬇️ Antworten sichern» speichern.`, async () => {
    try {
      const batch = firebaseDb.batch();
      const clearedAt = Date.now();
      const del = firebase.firestore.FieldValue.delete();
      schreibraumLastStudents.forEach(s => {
        batch.update(schreibraumRoomRef(schreibraumPin).collection("students").doc(s.id), { text: "", drawingData: del, reaction: del, done: false, clearedAt, updatedAt: clearedAt });
      });
      await batch.commit();
    } catch (e) {
      console.error("Schreibraum: Boards konnten nicht geleert werden.", e);
      openConfirm("Boards konnten nicht geleert werden. Prüfe die Internetverbindung.", null, "OK");
    }
  }, "Alle leeren");
});

/* ---- Karten ---- */
function schreibraumCardBodyHtml(s) {
  const text = (s.text || "").trim() ? s.text : "";
  const img = schreibraumSafeImage(s.drawingData);
  if (!text && !img) return `<div class="schreibraum-card-empty">– noch leer –</div>`;
  return (text ? `<div class="schreibraum-card-text">${escapeHtml(text)}</div>` : "") + (img ? `<img src="${img}" alt="Zeichnung">` : "");
}
function schreibraumCardHtml(s) {
  const away = schreibraumIsAway(s);
  const hasContent = schreibraumHasContent(s);
  const color = schreibraumSafeColor(s.color);
  const badges = (s.done ? '<span class="schreibraum-away-badge schreibraum-done-badge">✅ fertig</span>' : "")
    + (s.left ? '<span class="schreibraum-away-badge">hat verlassen</span>' : away ? '<span class="schreibraum-away-badge">nicht in der App</span>' : "");
  const lastReaction = s.reaction && s.reaction.emoji ? `<span class="schreibraum-last-reaction" title="Zuletzt gesendet">${escapeHtml(s.reaction.emoji)}</span>` : "";
  const reactButtons = SCHREIBRAUM_REACTIONS.map(r => `<button class="schreibraum-react-btn" data-action="react" data-emoji="${r.emoji}" title="«${escapeHtml(r.text)}» nur an diese Person senden">${r.emoji}</button>`).join("");
  return `
    <div class="setup-card schreibraum-card${away ? " schreibraum-card-away" : ""}" data-card-id="${escapeHtml(s.id)}" style="border-left-color:${color};">
      <div class="schreibraum-card-head">
        <div class="schreibraum-card-name">${escapeHtml(s.name || "?")}${badges}${lastReaction}</div>
        <div class="schreibraum-card-actions">
          ${hasContent ? reactButtons : ""}
          <button class="schreibraum-react-btn" data-action="kick" title="Aus dem Raum entfernen">✕</button>
        </div>
      </div>
      <div class="schreibraum-card-body">${schreibraumCardBodyHtml(s)}</div>

const SCHREIBRAUM_MONITOR_PAGE_SIZE = 24;
let schreibraumMonitorZoom = 4;
let schreibraumMonitorPage = 0;
// Nur geänderte Karten neu aufbauen: verhindert Flackern und neu ladende Bilder bei 30 Boards
function schreibraumRenderMonitorGrid() {
  const students = schreibraumLastStudents;
  const totalPages = Math.max(1, Math.ceil(students.length / SCHREIBRAUM_MONITOR_PAGE_SIZE));
  if (schreibraumMonitorPage >= totalPages) schreibraumMonitorPage = totalPages - 1;
  if (schreibraumMonitorPage < 0) schreibraumMonitorPage = 0;
  const start = schreibraumMonitorPage * SCHREIBRAUM_MONITOR_PAGE_SIZE;
  const pageStudents = students.slice(start, start + SCHREIBRAUM_MONITOR_PAGE_SIZE);
  const grid = document.getElementById("schreibraumMonitorGrid");
  grid.style.gridTemplateColumns = `repeat(${schreibraumMonitorZoom}, minmax(0, 1fr))`;
  const pager = document.getElementById("schreibraumMonitorPager");
  pager.classList.toggle("hidden", totalPages <= 1);
  document.getElementById("schreibraumMonitorPageLabel").textContent = `Seite ${schreibraumMonitorPage + 1}/${totalPages}`;
  document.getElementById("schreibraumMonitorPrevBtn").disabled = schreibraumMonitorPage === 0;
  document.getElementById("schreibraumMonitorNextBtn").disabled = schreibraumMonitorPage >= totalPages - 1;
  if (!pageStudents.length) {
    schreibraumCardCache.clear();
    grid.innerHTML = `<p style="color:var(--muted); grid-column:1/-1;">Noch niemand beigetreten. Tippe auf den QR-Code, um ihn gross zu zeigen.</p>`;
    return;
  }
  Array.from(grid.children).forEach(el => { if (!el.dataset.cardId) el.remove(); });
  const existing = new Map();
  Array.from(grid.children).forEach(el => existing.set(el.dataset.cardId, el));
  pageStudents.forEach((s, i) => {
    const html = schreibraumCardHtml(s);
    let el = existing.get(s.id);
    if (!el || schreibraumCardCache.get(s.id) !== html) {
      const tpl = document.createElement("template");
      tpl.innerHTML = html.trim();
      const fresh = tpl.content.firstElementChild;
      if (el) el.replaceWith(fresh);
      el = fresh;
      schreibraumCardCache.set(s.id, html);
    }
    existing.delete(s.id);
    if (grid.children[i] !== el) grid.insertBefore(el, grid.children[i] || null);
  });
  existing.forEach((el, id) => { el.remove(); schreibraumCardCache.delete(id); });
}

document.getElementById("schreibraumJoinBtn").addEventListener("click", async () => {
  const pin = document.getElementById("schreibraumJoinPinInput").value.trim();
  const name = document.getElementById("schreibraumJoinNameInput").value.trim().replace(/\s+/g, " ");
  document.getElementById("schreibraumJoinError").classList.add("hidden");
  if (!/^\d{4}$/.test(pin)) { schreibraumJoinErr("Bitte die 4-stellige PIN eingeben."); return; }
  if (!name) { schreibraumJoinErr("Bitte einen Namen eingeben."); return; }
  const btn = document.getElementById("schreibraumJoinBtn");
  btn.disabled = true;
  try {
    const ok = await ensureFirebase();
    if (!ok) { schreibraumJoinErr("Keine Verbindung zum Schreibraum-Server möglich."); return; }
    const roomRef = schreibraumRoomRef(pin);
    const roomDoc = await roomRef.get();
    const room = roomDoc.data();
    if (!roomDoc.exists || room.phase === "closed" || Date.now() - (room.createdAt || 0) > SCHREIBRAUM_ROOM_MAX_AGE_MS) {
      schreibraumJoinErr("Diesen Raum gibt es nicht (mehr). Prüfe die PIN.");
      return;
    }
    const nameKey = name.toLowerCase();
    const same = await roomRef.collection("students").where("nameKey", "==", nameKey).get();
    if (same.docs.some(d => !d.data().left)) {
      schreibraumJoinErr(`«${name}» ist schon im Raum. Ergänze z.B. das Initial deines Nachnamens. Warst du das selbst? Dann tippe oben auf «Weiterschreiben».`);
      return;
    }
    if (!same.empty) {
      // gleiche Person kommt nach «Verlassen» zurück: altes Board weiterverwenden statt Doppel-Karte
      const old = same.docs[0];
      await old.ref.update({ left: false, active: true, color: schreibraumSelectedColor, lastSeen: firebase.firestore.FieldValue.serverTimestamp() });
      schreibraumEnterWrite(pin, old.id, { ...old.data(), color: schreibraumSelectedColor });
      return;
    }
    const now = Date.now();
    const data = { name, nameKey, text: "", mode: "text", color: schreibraumSelectedColor, joinedAt: now, updatedAt: now, active: true, done: false, lastSeen: firebase.firestore.FieldValue.serverTimestamp() };
    const studentRef = await roomRef.collection("students").add(data);
    schreibraumEnterWrite(pin, studentRef.id, data);
  } catch (e) {
    console.error("Schreibraum: Beitritt fehlgeschlagen.", e);
    schreibraumJoinErr("Beitritt fehlgeschlagen. Prüfe die Internetverbindung.");
  } finally {
    btn.disabled = false;
  }
});
async function schreibraumResumeStudent() {
  const session = storageGet(SCHREIBRAUM_STUDENT_KEY);
  if (!session) return;
  const forget = (msg) => {
    storageSet(SCHREIBRAUM_STUDENT_KEY, null);
    schreibraumRenderResume();
    openConfirm(msg, null, "OK");
  };
  try {
    if (!(await ensureFirebase())) { openConfirm("Keine Verbindung zum Schreibraum-Server möglich.", null, "OK"); return; }
    const roomDoc = await schreibraumRoomRef(session.pin).get();
    if (!roomDoc.exists || roomDoc.data().phase === "closed") { forget("Dieser Raum ist geschlossen."); return; }
    const studentRef = schreibraumRoomRef(session.pin).collection("students").doc(session.id);
    const studentDoc = await studentRef.get();
    if (!studentDoc.exists) { forget("Dein Board gibt es nicht mehr. Tritt neu bei."); return; }
    await studentRef.update({ left: false, active: true, lastSeen: firebase.firestore.FieldValue.serverTimestamp() });
    schreibraumEnterWrite(session.pin, session.id, studentDoc.data());
  } catch (e) {
    console.error("Schreibraum: Fortsetzen fehlgeschlagen.", e);
    openConfirm("Fortsetzen fehlgeschlagen. Prüfe die Internetverbindung.", null, "OK");
  }
}

function schreibraumEnterWrite(pin, id, data) {
  schreibraumIsHost = false;
  schreibraumPin = pin;
  schreibraumStudentId = id;
  schreibraumStudentName = data.name;
  schreibraumRoomClosed = false;
  const color = schreibraumSafeColor(data.color);
  storageSet(SCHREIBRAUM_STUDENT_KEY, { pin, id, name: data.name, color });
  schreibraumLastReactionTs = data.reaction && data.reaction.ts ? data.reaction.ts : 0;
  schreibraumLastClearedAt = data.clearedAt || 0;
  document.getElementById("schreibraumWriteName").textContent = data.name;
  document.getElementById("schreibraumWriteCard").style.setProperty("--board-color", color);
  document.getElementById("schreibraumWriteTextarea").value = data.text || "";
  document.getElementById("schreibraumWriteQuestion").classList.add("hidden");
  schreibraumSetDone(!!data.done);
  schreibraumSetLocked(false);
  schreibraumResetCanvas();
  const img = schreibraumSafeImage(data.drawingData);
  if (img) schreibraumLoadDrawing(img);
  schreibraumSetMode(data.mode === "draw" ? "draw" : "text", true);
  schreibraumPendingWrites = 0;
  schreibraumWriteFailed = false;
  schreibraumRenderStatus();
  showView("schreibraumWrite");
  schreibraumStopListening();
  schreibraumStartHeartbeat();
  let lastQuestion = null;
  schreibraumRoomUnsub = schreibraumRoomRef(pin).onSnapshot(snap => {
    const room = snap.data();
    if (!snap.exists || !room || room.phase === "closed") { schreibraumEndStudentSession("Die Lehrperson hat den Raum geschlossen."); return; }
    schreibraumSetLocked(room.phase === "locked");
    const qEl = document.getElementById("schreibraumWriteQuestion");
    if (room.question) { qEl.textContent = "❓ " + room.question; qEl.classList.remove("hidden"); }
    else { qEl.classList.add("hidden"); }
    if (lastQuestion !== null && room.question && room.question !== lastQuestion) {
      qEl.classList.remove("schreibraum-flash");
      void qEl.offsetWidth;
      qEl.classList.add("schreibraum-flash");
    }
    lastQuestion = room.question || "";
  }, err => console.error("Schreibraum: Raum-Update fehlgeschlagen.", err));
  schreibraumSelfUnsub = schreibraumStudentRef().onSnapshot(snap => {
    const data = snap.data();
    if (!snap.exists || !data) {
      // kurz warten: beim Schliessen kommt die Raum-Meldung meist zuerst
      setTimeout(() => { if (schreibraumStudentId === id && !schreibraumRoomClosed) schreibraumEndStudentSession("Die Lehrperson hat dein Board entfernt. Du kannst neu beitreten."); }, 1500);
      return;
    }
    if (data.reaction && data.reaction.ts && data.reaction.ts !== schreibraumLastReactionTs) {
      schreibraumLastReactionTs = data.reaction.ts;
      schreibraumShowReaction(data.reaction.emoji || "👍");
    }
    if (data.clearedAt && data.clearedAt !== schreibraumLastClearedAt) {
      schreibraumLastClearedAt = data.clearedAt;
      clearTimeout(schreibraumSaveTimeout);
      clearTimeout(schreibraumDrawSyncTimeout);
      document.getElementById("schreibraumWriteTextarea").value = "";
      schreibraumResetCanvas();
      schreibraumSetDone(false);
    }
  }, err => console.error("Schreibraum: Eigenes Board konnte nicht beobachtet werden.", err));
}

/* ---- Speicherstatus: SuS sollen sehen, ob ihre Antwort angekommen ist ---- */
let schreibraumPendingWrites = 0, schreibraumWriteFailed = false;
function schreibraumTrackWrite(promise) {
  schreibraumPendingWrites++;
  schreibraumRenderStatus();
  return promise
    .then(() => { schreibraumWriteFailed = false; })
    .catch(err => { schreibraumWriteFailed = true; console.error("Schreibraum: Speichern fehlgeschlagen.", err); })
    .finally(() => { schreibraumPendingWrites--; schreibraumRenderStatus(); });
}
function schreibraumRenderStatus() {
  const el = document.getElementById("schreibraumWriteStatus");
  let text = "✓ Gespeichert", cls = "";
  if (!navigator.onLine) { text = "⚠️ Offline – wird nachgesendet"; cls = "schreibraum-status-warn"; }
  else if (schreibraumWriteFailed) { text = "⚠️ Nicht gespeichert"; cls = "schreibraum-status-warn"; }
  else if (schreibraumPendingWrites > 0) { text = "⏳ Sende …"; cls = "schreibraum-status-busy"; }
  el.textContent = text;
  el.className = "schreibraum-status" + (cls ? " " + cls : "");
}

function schreibraumCanvasCtx() { return document.getElementById("schreibraumDrawCanvas").getContext("2d"); }
function schreibraumResetCanvas() {
  const canvas = document.getElementById("schreibraumDrawCanvas");
  canvas.width = SCHREIBRAUM_CANVAS_W;
  canvas.height = SCHREIBRAUM_CANVAS_H;
  const ctx = canvas.getContext("2d");
  ctx.fillStyle = "#ffffff";
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.lineCap = "round";
  ctx.lineJoin = "round";
  schreibraumCanvasDirty = false;
  schreibraumUndoStack.length = 0;
  schreibraumUpdateUndoBtn();
}
function schreibraumLoadDrawing(src) {
  const img = new Image();
  img.onload = () => {
    schreibraumCanvasCtx().drawImage(img, 0, 0, SCHREIBRAUM_CANVAS_W, SCHREIBRAUM_CANVAS_H);
    schreibraumCanvasDirty = true;
  };
  img.src = src;
}
function schreibraumPushUndo() {
  schreibraumUndoStack.push({ image: schreibraumCanvasCtx().getImageData(0, 0, SCHREIBRAUM_CANVAS_W, SCHREIBRAUM_CANVAS_H), dirty: schreibraumCanvasDirty });
  if (schreibraumUndoStack.length > SCHREIBRAUM_UNDO_MAX) schreibraumUndoStack.shift();
  schreibraumUpdateUndoBtn();
}
function schreibraumUpdateUndoBtn() { document.getElementById("schreibraumUndoBtn").disabled = schreibraumLocked || !schreibraumUndoStack.length; }
document.getElementById("schreibraumUndoBtn").addEventListener("click", () => {
  const last = schreibraumUndoStack.pop();
  if (!last) return;
  schreibraumCanvasCtx().putImageData(last.image, 0, 0);
  schreibraumCanvasDirty = last.dirty;
  schreibraumUpdateUndoBtn();
  schreibraumScheduleDrawSync();
});
document.querySelectorAll(".schreibraum-color-swatch[data-color]").forEach(btn => {
  if (btn.closest("#schreibraumJoinColorRow")) return;
  btn.addEventListener("click", () => {
    schreibraumPenColor = btn.dataset.color;
    schreibraumIsEraser = false;
    btn.parentElement.querySelectorAll(".schreibraum-color-swatch").forEach(b => b.classList.toggle("schreibraum-active", b === btn));
    document.getElementById("schreibraumEraserBtn").classList.remove("btn-active");
  });
});
document.querySelectorAll(".schreibraum-size-btn").forEach(btn => btn.addEventListener("click", () => {
  schreibraumPenSize = Number(btn.dataset.size);
  document.querySelectorAll(".schreibraum-size-btn").forEach(b => b.classList.toggle("schreibraum-active", b === btn));
}));
document.getElementById("schreibraumEraserBtn").addEventListener("click", () => {
  schreibraumIsEraser = !schreibraumIsEraser;
  document.getElementById("schreibraumEraserBtn").classList.toggle("btn-active", schreibraumIsEraser);
});
(function schreibraumWireCanvas() {
  const canvas = document.getElementById("schreibraumDrawCanvas");
  let drawing = false, points = [];
  function pos(e) {
    const rect = canvas.getBoundingClientRect();
    return { x: (e.clientX - rect.left) * SCHREIBRAUM_CANVAS_W / rect.width, y: (e.clientY - rect.top) * SCHREIBRAUM_CANVAS_H / rect.height };
  }
  function applyPen(ctx) {
    ctx.strokeStyle = schreibraumIsEraser ? "#ffffff" : schreibraumPenColor;
    ctx.lineWidth = schreibraumIsEraser ? schreibraumPenSize * 4 : schreibraumPenSize;
  }
  function strokeSegment(p0, p1, p2) {
    const ctx = canvas.getContext("2d");
    applyPen(ctx);
    const mid1 = { x: (p0.x + p1.x) / 2, y: (p0.y + p1.y) / 2 };
    const mid2 = { x: (p1.x + p2.x) / 2, y: (p1.y + p2.y) / 2 };
    ctx.beginPath();
    ctx.moveTo(mid1.x, mid1.y);
    ctx.quadraticCurveTo(p1.x, p1.y, mid2.x, mid2.y);
    ctx.stroke();
  }
  canvas.addEventListener("pointerdown", (e) => {
    if (schreibraumLocked) return;
    schreibraumPushUndo();
    drawing = true;
    const p = pos(e);
    points = [p, p];
    const ctx = canvas.getContext("2d");
    applyPen(ctx);
    ctx.beginPath();
    ctx.arc(p.x, p.y, ctx.lineWidth / 2, 0, Math.PI * 2);
    ctx.fillStyle = ctx.strokeStyle;
    ctx.fill();
    if (!schreibraumIsEraser) schreibraumCanvasDirty = true;
    try { canvas.setPointerCapture(e.pointerId); } catch (err) {}
  });
  canvas.addEventListener("pointermove", (e) => {
    if (!drawing) return;
    const p = pos(e);
    points.push(p);
    if (points.length >= 3) {
      const l = points.length - 1;
      strokeSegment(points[l - 2], points[l - 1], points[l]);
    }
  });
  function endStroke() {
    if (!drawing) return;
    drawing = false;
    schreibraumScheduleDrawSync();
  }
  canvas.addEventListener("pointerup", endStroke);
  canvas.addEventListener("pointercancel", endStroke);
})();
let schreibraumDrawSyncTimeout = null;
function schreibraumScheduleDrawSync() {
  clearTimeout(schreibraumDrawSyncTimeout);
  schreibraumDrawSyncTimeout = setTimeout(schreibraumSyncDrawing, 350);
}
// Verkleinert als JPEG senden: ein Firestore-Dokument darf höchstens 1 MB gross sein
function schreibraumExportDrawing() {
  const out = document.createElement("canvas");
  out.width = SCHREIBRAUM_EXPORT_W;
  out.height = SCHREIBRAUM_EXPORT_H;
  out.getContext("2d").drawImage(document.getElementById("schreibraumDrawCanvas"), 0, 0, out.width, out.height);
  let data = out.toDataURL("image/jpeg", 0.8);
  if (data.length > 700000) data = out.toDataURL("image/jpeg", 0.5);
  return data;
}
function schreibraumSyncDrawing() {
  if (!schreibraumPin || !schreibraumStudentId) return;
  const drawingData = schreibraumCanvasDirty ? schreibraumExportDrawing() : firebase.firestore.FieldValue.delete();
  schreibraumSaveStudent({ drawingData });
}
document.getElementById("schreibraumDrawClearBtn").addEventListener("click", () => {
  schreibraumPushUndo();
  const undo = schreibraumUndoStack.slice();
  schreibraumResetCanvas();
  schreibraumUndoStack.push(...undo);
  schreibraumUpdateUndoBtn();
  schreibraumScheduleDrawSync();
});
document.getElementById("schreibraumWriteLeaveBtn").addEventListener("click", () => {
  openConfirm("Schreibraum verlassen? Deine Antwort bleibt bei der Lehrperson sichtbar.", () => {
    clearTimeout(schreibraumSaveTimeout);
    schreibraumStudentRef().update({ left: true, active: false }).catch(() => {});
    schreibraumStopListening();
    storageSet(SCHREIBRAUM_STUDENT_KEY, null);
    schreibraumPin = null;
    schreibraumStudentId = null;
    showView("schreibraumPick");
  }, "Verlassen");
});
(function schreibraumCheckUrlJoin() {
  const params = new URLSearchParams(location.search);
  const pin = params.get("join");
  showView("schreibraumPick");
  if (pin) {
    document.getElementById("schreibraumJoinPinInput").value = pin;
    showView("schreibraumJoin");
    document.getElementById("schreibraumJoinNameInput").focus();
  }
})();

if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => { navigator.serviceWorker.register("sw.js").catch(() => {}); });
}
</script>
